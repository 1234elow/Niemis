version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: niemis_postgres_local
    environment:
      POSTGRES_DB: niemis_local
      POSTGRES_USER: niemis_user
      POSTGRES_PASSWORD: local_password123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - niemis_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niemis_user -d niemis_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (optional for local development)
  redis:
    image: redis:7-alpine
    container_name: niemis_redis_local
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - niemis_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NiEMIS Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: niemis_backend_local
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=niemis_local
      - DB_USER=niemis_user
      - DB_PASSWORD=local_password123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your_super_secret_jwt_key_for_local_development
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80
      - LOG_LEVEL=debug
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - /app/node_modules
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    networks:
      - niemis_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: npm run dev

  # NiEMIS Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: niemis_frontend_local
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:5000
      - VITE_API_BASE_URL=http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - frontend_build:/app/build
    networks:
      - niemis_network
    restart: unless-stopped
    command: npm run dev

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: niemis_nginx_local
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./local-nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl-certs:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - niemis_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Adminer (Database Management Interface)
  adminer:
    image: adminer:latest
    container_name: niemis_adminer_local
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - niemis_network
    restart: unless-stopped
    environment:
      - ADMINER_DEFAULT_SERVER=postgres

  # Mailcatcher (Email testing)
  mailcatcher:
    image: schickling/mailcatcher
    container_name: niemis_mailcatcher_local
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - niemis_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_uploads:
    driver: local
  frontend_build:
    driver: local
  nginx_logs:
    driver: local

networks:
  niemis_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: niemis_postgres
    environment:
      POSTGRES_DB: niemis_db
      POSTGRES_USER: niemis_user
      POSTGRES_PASSWORD: secure_password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    networks:
      - niemis_network

  # Backend API
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: niemis_backend
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: niemis_db
      DB_USER: niemis_user
      DB_PASSWORD: secure_password123
      JWT_SECRET: your_jwt_secret_key_change_this_in_production
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - niemis_network

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: niemis_frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - niemis_network

  # Redis for Caching (Optional)
  redis:
    image: redis:7-alpine
    container_name: niemis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - niemis_network

volumes:
  postgres_data:
  redis_data:

networks:
  niemis_network:
    driver: bridge